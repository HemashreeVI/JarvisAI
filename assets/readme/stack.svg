<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img" aria-labelledby="stk-t stk-d">
<title id="stk-t">Nova tech stack</title>
<desc id="stk-d">Brain: Ollama, qwen2.5, nomic-embed-text; Voice: Whisper, Neural TTS, offline voice; Body: three.js, Electron, pywebview; Memory: SQLite, search by meaning, fading; System: Python 3.11–3.14, Windows, tray icon; Quality: pytest, plug-in skills, asks first</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="stk-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#10224A"/><stop offset=".55" stop-color="#0A1428"/><stop offset="1" stop-color="#050A16"/></radialGradient>
<radialGradient id="stk-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1F4FD1" stop-opacity=".5"/><stop offset="1" stop-color="#1F4FD1" stop-opacity="0"/></radialGradient>
<radialGradient id="stk-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5BE0FF" stop-opacity=".14"/><stop offset="1" stop-color="#5BE0FF" stop-opacity="0"/></radialGradient>
<linearGradient id="stk-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#B8F1FF"/><stop offset="1" stop-color="#5BE0FF"/></linearGradient>
<linearGradient id="stk-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5BE0FF" stop-opacity="0"/><stop offset=".25" stop-color="#5BE0FF" stop-opacity=".85"/><stop offset="1" stop-color="#5BE0FF" stop-opacity="0"/></linearGradient>
<pattern id="stk-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5BE0FF" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="446" rx="22" fill="url(#stk-bg)" stroke="#1B2C55"/>
<rect x="1" y="1" width="1198" height="446" rx="22" fill="url(#stk-grid)"/>
<ellipse cx="600" cy="224" rx="420" ry="314" fill="url(#stk-glowA)"/>
<ellipse cx="600" cy="224" rx="300" ry="224" fill="url(#stk-glowB)"/><rect x="40" y="40" width="363" height="176" rx="16" fill="#0D1A36" stroke="#28407A"/><text x="60" y="72" class="mono" font-size="11" fill="#5BE0FF" text-anchor="start" letter-spacing="2.5">BRAIN</text><text x="60" y="110" class="serif" font-size="22" fill="#EEF4FF" text-anchor="start" >Ollama</text><text x="60" y="146" class="serif" font-size="17" fill="#C7D3EE" text-anchor="start" >qwen2.5</text><text x="60" y="177" class="serif" font-size="15" fill="#8C9BC0" text-anchor="start" >nomic-embed-text</text><rect x="419" y="40" width="363" height="176" rx="16" fill="#0D1A36" stroke="#28407A"/><text x="439" y="72" class="mono" font-size="11" fill="#5BE0FF" text-anchor="start" letter-spacing="2.5">VOICE</text><text x="439" y="110" class="serif" font-size="22" fill="#EEF4FF" text-anchor="start" >Whisper</text><text x="439" y="146" class="serif" font-size="17" fill="#C7D3EE" text-anchor="start" >Neural TTS</text><text x="439" y="177" class="serif" font-size="15" fill="#8C9BC0" text-anchor="start" >offline voice</text><rect x="797" y="40" width="363" height="176" rx="16" fill="#0D1A36" stroke="#28407A"/><text x="817" y="72" class="mono" font-size="11" fill="#5BE0FF" text-anchor="start" letter-spacing="2.5">BODY</text><text x="817" y="110" class="serif" font-size="22" fill="#EEF4FF" text-anchor="start" >three.js</text><text x="817" y="146" class="serif" font-size="17" fill="#C7D3EE" text-anchor="start" >Electron</text><text x="817" y="177" class="serif" font-size="15" fill="#8C9BC0" text-anchor="start" >pywebview</text><rect x="40" y="232" width="363" height="176" rx="16" fill="#0D1A36" stroke="#28407A"/><text x="60" y="264" class="mono" font-size="11" fill="#5BE0FF" text-anchor="start" letter-spacing="2.5">MEMORY</text><text x="60" y="302" class="serif" font-size="22" fill="#EEF4FF" text-anchor="start" >SQLite</text><text x="60" y="338" class="serif" font-size="17" fill="#C7D3EE" text-anchor="start" >search by meaning</text><text x="60" y="369" class="serif" font-size="15" fill="#8C9BC0" text-anchor="start" >fading</text><rect x="419" y="232" width="363" height="176" rx="16" fill="#0D1A36" stroke="#28407A"/><text x="439" y="264" class="mono" font-size="11" fill="#5BE0FF" text-anchor="start" letter-spacing="2.5">SYSTEM</text><text x="439" y="302" class="serif" font-size="22" fill="#EEF4FF" text-anchor="start" >Python 3.11–3.14</text><text x="439" y="338" class="serif" font-size="17" fill="#C7D3EE" text-anchor="start" >Windows</text><text x="439" y="369" class="serif" font-size="15" fill="#8C9BC0" text-anchor="start" >tray icon</text><rect x="797" y="232" width="363" height="176" rx="16" fill="#0D1A36" stroke="#28407A"/><text x="817" y="264" class="mono" font-size="11" fill="#5BE0FF" text-anchor="start" letter-spacing="2.5">QUALITY</text><text x="817" y="302" class="serif" font-size="22" fill="#EEF4FF" text-anchor="start" >pytest</text><text x="817" y="338" class="serif" font-size="17" fill="#C7D3EE" text-anchor="start" >plug-in skills</text><text x="817" y="369" class="serif" font-size="15" fill="#8C9BC0" text-anchor="start" >asks first</text>
