<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 426" width="1200" height="426" role="img" aria-labelledby="flow-t flow-d">
<title id="flow-t">How Nova works</title>
<desc id="flow-d">Hear (Whisper speech-to-text) → Feel (mood from words + tone) → Think (local LLM + memory) → Act (apps, web, reminders) → Show (3D body, eyes and Pip) → Speak (neural voice, by mood)</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="flow-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#10224A"/><stop offset=".55" stop-color="#0A1428"/><stop offset="1" stop-color="#050A16"/></radialGradient>
<radialGradient id="flow-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1F4FD1" stop-opacity=".5"/><stop offset="1" stop-color="#1F4FD1" stop-opacity="0"/></radialGradient>
<radialGradient id="flow-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5BE0FF" stop-opacity=".14"/><stop offset="1" stop-color="#5BE0FF" stop-opacity="0"/></radialGradient>
<linearGradient id="flow-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#B8F1FF"/><stop offset="1" stop-color="#5BE0FF"/></linearGradient>
<linearGradient id="flow-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5BE0FF" stop-opacity="0"/><stop offset=".25" stop-color="#5BE0FF" stop-opacity=".85"/><stop offset="1" stop-color="#5BE0FF" stop-opacity="0"/></linearGradient>
<pattern id="flow-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5BE0FF" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="424" rx="22" fill="url(#flow-bg)" stroke="#1B2C55"/>
<rect x="1" y="1" width="1198" height="424" rx="22" fill="url(#flow-grid)"/>
<ellipse cx="600" cy="213" rx="420" ry="298" fill="url(#flow-glowA)"/>
<ellipse cx="600" cy="213" rx="300" ry="213" fill="url(#flow-glowB)"/><g class="float" style="animation-delay:-0.0s">
<rect x="40" y="50" width="344" height="128" rx="18" fill="#0D1A36" stroke="#28407A"/>
<circle cx="70" cy="82" r="13" fill="none" stroke="#5BE0FF"/>
<circle cx="70" cy="82" r="4.5" fill="#B8F1FF" class="pulse" style="animation-delay:0.0s"/>
<text x="94" y="87" class="mono" font-size="11" fill="#8C9BC0" text-anchor="start" letter-spacing="2">01</text>
<text x="62" y="132" class="serif" font-size="26" fill="#EEF4FF" text-anchor="start" >Hear</text>
<text x="62" y="156" class="mono" font-size="12" fill="#C7D3EE" text-anchor="start" >Whisper speech-to-text</text>
</g><g class="float" style="animation-delay:-0.7s">
<rect x="428" y="50" width="344" height="128" rx="18" fill="#0D1A36" stroke="#28407A"/>
<circle cx="458" cy="82" r="13" fill="none" stroke="#5BE0FF"/>
<circle cx="458" cy="82" r="4.5" fill="#B8F1FF" class="pulse" style="animation-delay:0.5s"/>
<text x="482" y="87" class="mono" font-size="11" fill="#8C9BC0" text-anchor="start" letter-spacing="2">02</text>
<text x="450" y="132" class="serif" font-size="26" fill="#EEF4FF" text-anchor="start" >Feel</text>
<text x="450" y="156" class="mono" font-size="12" fill="#C7D3EE" text-anchor="start" >mood from words + tone</text>
</g><g class="float" style="animation-delay:-1.4s">
<rect x="816" y="50" width="344" height="128" rx="18" fill="#0D1A36" stroke="#28407A"/>
<circle cx="846" cy="82" r="13" fill="none" stroke="#5BE0FF"/>
<circle cx="846" cy="82" r="4.5" fill="#B8F1FF" class="pulse" style="animation-delay:1.0s"/>
<text x="870" y="87" class="mono" font-size="11" fill="#8C9BC0" text-anchor="start" letter-spacing="2">03</text>
<text x="838" y="132" class="serif" font-size="26" fill="#EEF4FF" text-anchor="start" >Think</text>
<text x="838" y="156" class="mono" font-size="12" fill="#C7D3EE" text-anchor="start" >local LLM + memory</text>
</g><g class="float" style="animation-delay:-2.1s">
<rect x="40" y="248" width="344" height="128" rx="18" fill="#0D1A36" stroke="#28407A"/>
<circle cx="70" cy="280" r="13" fill="none" stroke="#5BE0FF"/>
<circle cx="70" cy="280" r="4.5" fill="#B8F1FF" class="pulse" style="animation-delay:1.5s"/>
<text x="94" y="285" class="mono" font-size="11" fill="#8C9BC0" text-anchor="start" letter-spacing="2">04</text>
<text x="62" y="330" class="serif" font-size="26" fill="#EEF4FF" text-anchor="start" >Act</text>
<text x="62" y="354" class="mono" font-size="12" fill="#C7D3EE" text-anchor="start" >apps, web, reminders</text>
</g><g class="float" style="animation-delay:-2.8s">
<rect x="428" y="248" width="344" height="128" rx="18" fill="#0D1A36" stroke="#28407A"/>
<circle cx="458" cy="280" r="13" fill="none" stroke="#5BE0FF"/>
<circle cx="458" cy="280" r="4.5" fill="#B8F1FF" class="pulse" style="animation-delay:2.0s"/>
<text x="482" y="285" class="mono" font-size="11" fill="#8C9BC0" text-anchor="start" letter-spacing="2">05</text>
<text x="450" y="330" class="serif" font-size="26" fill="#EEF4FF" text-anchor="start" >Show</text>
<text x="450" y="354" class="mono" font-size="12" fill="#C7D3EE" text-anchor="start" >3D body, eyes and Pip</text>
</g><g class="float" style="animation-delay:-3.5s">
<rect x="816" y="248" width="344" height="128" rx="18" fill="#0D1A36" stroke="#28407A"/>
<circle cx="846" cy="280" r="13" fill="none" stroke="#5BE0FF"/>
<circle cx="846" cy="280" r="4.5" fill="#B8F1FF" class="pulse" style="animation-delay:2.5s"/>
<text x="870" y="285" class="mono" font-size="11" fill="#8C9BC0" text-anchor="start" letter-spacing="2">06</text>
<text x="838" y="330" class="serif" font-size="26" fill="#EEF4FF" text-anchor="start" >Speak</text>
<text x="838" y="354" class="mono" font-size="12" fill="#C7D3EE" text-anchor="start" >neural voice, by mood</text>
</g><path d="M389 114H421" fill="none" stroke="#5BE0FF" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M415 109l7 5-7 5" fill="none" stroke="#5BE0FF"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.0s" path="M389 114H421"/></circle><path d="M777 114H809" fill="none" stroke="#5BE0FF" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M803 109l7 5-7 5" fill="none" stroke="#5BE0FF"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.4s" path="M777 114H809"/></circle><path d="M988 183V213H212V241" fill="none" stroke="#5BE0FF" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M207 235l5 7 5-7" fill="none" stroke="#5BE0FF"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.8s" path="M988 183V213H212V241"/></circle><path d="M389 312H421" fill="none" stroke="#5BE0FF" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M415 307l7 5-7 5" fill="none" stroke="#5BE0FF"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="1.2s" path="M389 312H421"/></circle><path d="M777 312H809" fill="none" stroke="#5BE0FF" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M803 307l7 5-7 5" fill="none" stroke="#5BE0FF"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="1.6s" path="M777 312H809"/></circle>
</svg>
