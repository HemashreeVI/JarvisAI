<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="tbl-t tbl-d">
<title id="tbl-t">Talk To Her</title>
<desc id="tbl-d">Do this: Say “Hey Nova, …”, And Nova...: wakes up and does it; Do this: Click Nova, or press Ctrl+Alt+N, And Nova...: listens right away; Do this: Double-click Nova, And Nova...: opens a box to type in; Do this: Click Pip, And Nova...: Pip gets head pats; Do this: Right-click, And Nova...: talk, type, spin, dance, crawl, walk, cheer me up; Do this: Tray icon, And Nova...: show or hide, quiet for 1 hour, turn off</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="tbl-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#10224A"/><stop offset=".55" stop-color="#0A1428"/><stop offset="1" stop-color="#050A16"/></radialGradient>
<radialGradient id="tbl-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1F4FD1" stop-opacity=".5"/><stop offset="1" stop-color="#1F4FD1" stop-opacity="0"/></radialGradient>
<radialGradient id="tbl-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5BE0FF" stop-opacity=".14"/><stop offset="1" stop-color="#5BE0FF" stop-opacity="0"/></radialGradient>
<linearGradient id="tbl-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#B8F1FF"/><stop offset="1" stop-color="#5BE0FF"/></linearGradient>
<linearGradient id="tbl-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5BE0FF" stop-opacity="0"/><stop offset=".25" stop-color="#5BE0FF" stop-opacity=".85"/><stop offset="1" stop-color="#5BE0FF" stop-opacity="0"/></linearGradient>
<pattern id="tbl-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5BE0FF" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="388" rx="22" fill="url(#tbl-bg)" stroke="#1B2C55"/>
<rect x="1" y="1" width="1198" height="388" rx="22" fill="url(#tbl-grid)"/>
<ellipse cx="960" cy="117" rx="420" ry="273" fill="url(#tbl-glowA)"/>
<ellipse cx="240" cy="273" rx="300" ry="195" fill="url(#tbl-glowB)"/><rect x="40" y="40" width="1120" height="310" rx="14" fill="#0D1A36" stroke="#28407A"/><text x="58" y="70" class="mono" font-size="11" fill="#5BE0FF" text-anchor="start" letter-spacing="2">DO THIS</text><text x="506" y="70" class="mono" font-size="11" fill="#5BE0FF" text-anchor="start" letter-spacing="2">AND NOVA...</text><rect x="40" y="86" width="1120" height="1.2" fill="url(#tbl-rule)"/><text x="58" y="114" class="serif" font-size="16" fill="#EEF4FF" text-anchor="start" >Say “Hey Nova, …”</text><text x="506" y="114" class="mono" font-size="13" fill="#C7D3EE" text-anchor="start" >wakes up and does it</text><line x1="58" y1="130" x2="1142" y2="130" stroke="#1B2C55"/><text x="58" y="158" class="serif" font-size="16" fill="#EEF4FF" text-anchor="start" >Click Nova, or press Ctrl+Alt+N</text><text x="506" y="158" class="mono" font-size="13" fill="#C7D3EE" text-anchor="start" >listens right away</text><line x1="58" y1="174" x2="1142" y2="174" stroke="#1B2C55"/><text x="58" y="202" class="serif" font-size="16" fill="#EEF4FF" text-anchor="start" >Double-click Nova</text><text x="506" y="202" class="mono" font-size="13" fill="#C7D3EE" text-anchor="start" >opens a box to type in</text><line x1="58" y1="218" x2="1142" y2="218" stroke="#1B2C55"/><text x="58" y="246" class="serif" font-size="16" fill="#EEF4FF" text-anchor="start" >Click Pip</text><text x="506" y="246" class="mono" font-size="13" fill="#C7D3EE" text-anchor="start" >Pip gets head pats</text><line x1="58" y1="262" x2="1142" y2="262" stroke="#1B2C55"/><text x="58" y="290" class="serif" font-size="16" fill="#EEF4FF" text-anchor="start" >Right-click</text><text x="506" y="290" class="mono" font-size="13" fill="#C7D3EE" text-anchor="start" >talk, type, spin, dance, crawl, walk, cheer me up</text><line x1="58" y1="306" x2="1142" y2="306" stroke="#1B2C55"/><text x="58" y="334" class="serif" font-size="16" fill="#EEF4FF" text-anchor="start" >Tray icon</text><text x="506" y="334" class="mono" font-size="13" fill="#C7D3EE" text-anchor="start" >show or hide, quiet for 1 hour, turn off</text>
</svg>
