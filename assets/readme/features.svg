<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="feat-t feat-d">
<title id="feat-t">Nova features</title>
<desc id="feat-d">Real 3D, on top: Lit, glossy robot in a see-through window above every app. She spins, dances and waves.; Eyes tell everything: A glowing visor with eyes for every mood: happy, hearts, angry, sleepy.; Pip the robo-kitty: Hops when you're happy, hides when Nova is angry, loves head pats.; Feels with you: Reads your mood from your words and your voice tone, then cheers you up.; A real voice: Neural voice that sounds excited, soft or sleepy, with an offline backup.; Opens with you: Welcomes you when the lid opens, waves goodbye when it closes.; Watches over work: Break reminders, check-ins, a late-night nudge, a daily app summary.; Really remembers: Saves plans with real dates, finds memories by meaning, lets small ones fade.; Private brain: Thinks on your PC with Ollama. Everything stays in data/.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="feat-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#10224A"/><stop offset=".55" stop-color="#0A1428"/><stop offset="1" stop-color="#050A16"/></radialGradient>
<radialGradient id="feat-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1F4FD1" stop-opacity=".5"/><stop offset="1" stop-color="#1F4FD1" stop-opacity="0"/></radialGradient>
<radialGradient id="feat-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5BE0FF" stop-opacity=".14"/><stop offset="1" stop-color="#5BE0FF" stop-opacity="0"/></radialGradient>
<linearGradient id="feat-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#B8F1FF"/><stop offset="1" stop-color="#5BE0FF"/></linearGradient>
<linearGradient id="feat-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5BE0FF" stop-opacity="0"/><stop offset=".25" stop-color="#5BE0FF" stop-opacity=".85"/><stop offset="1" stop-color="#5BE0FF" stop-opacity="0"/></linearGradient>
<pattern id="feat-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5BE0FF" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="568" rx="22" fill="url(#feat-bg)" stroke="#1B2C55"/>
